    <title>智能位置对应助手</title>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; background-color: #f4f6f8; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
        h2 { text-align: center; color: #333; margin-top: 0; }
        label { font-weight: 600; display: block; margin-bottom: 8px; color: #444; }
        textarea { width: 100%; height: 100px; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; resize: vertical; }
        
        /* 折叠面板样式 */
        details { background: #f9f9f9; border: 1px solid #eee; border-radius: 8px; padding: 10px; margin-bottom: 15px; }
        summary { cursor: pointer; font-weight: bold; color: #007BFF; outline: none; }
        details[open] summary { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }

        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; transition: 0.2s; }
        .btn-primary { background-color: #007BFF; color: white; }
        .btn-success { background-color: #28a745; color: white; }
        .btn-secondary { background-color: #6c757d; color: white; }
        button:active { transform: scale(0.98); }
        
        #preview { max-width: 100%; margin-top: 15px; border-radius: 8px; display: none; border: 1px solid #eee; }
        .result-box { background-color: #e9ecef; padding: 15px; border-radius: 8px; min-height: 60px; font-size: 18px; line-height: 1.5; word-wrap: break-word; color: #333; }
        .status { text-align: center; color: #666; font-size: 14px; margin-top: 10px; }
    </style>
</head>

    <label>1. 获取清单号 (二选一)</label>
    
    <!-- 方式一：手动输入 -->
    <textarea id="manualInput" placeholder="直接输入或粘贴数字，如：5, 2, 9..."></textarea>
    
    <div style="text-align: center; margin: 10px 0; color: #999; font-size: 14px;">—— 或者 ——</div>

    <!-- 方式二：拍照识别 -->
    <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="handleImage(this)">
    <button class="btn-secondary" onclick="document.getElementById('imageInput').click()">📷 拍照/选图自动识别</button>
    <img id="preview" alt="图片预览">
    <div class="status" id="statusText"></div>
</div>

<div class="card">
    <label>2. 最终结果</label>
    <div class="result-box" id="output">等待输入...</div>
    
    <div class="btn-group">
        <button class="btn-primary" onclick="processMapping()">🔄 执行对应</button>
        <button class="btn-success" onclick="copyResult()">📋 复制结果</button>
    </div>
</div>

<script>
    // 拍照识别逻辑
    async function handleImage(input) {
        const file = input.files[0];
        if (!file) return;

        document.getElementById('preview').src = URL.createObjectURL(file);
        document.getElementById('preview').style.display = 'block';
        document.getElementById('statusText').innerText = "正在识别中，请稍候...";

        try {
            const worker = await Tesseract.createWorker();
            await worker.loadLanguage('eng');
            await worker.initialize('eng');
            await worker.setParameters({
                tessedit_char_whitelist: '0123456789., \n'
            });

            const { data: { text } } = await worker.recognize(file);
            await worker.terminate();

            // 将识别到的内容填入手动输入框
            document.getElementById('manualInput').value = text;
            document.getElementById('statusText').innerText = "识别完成！请核对输入框，如有错误可直接修改。";
            
            // 自动执行一次对应
            processMapping();

        } catch (error) {
            document.getElementById('statusText').innerText = "识别失败，请重试。";
        }
    }

    // 核心对应逻辑
    function processMapping() {
        const mapText = document.getElementById('mapInput').value;
        const listText = document.getElementById('manualInput').value;
        
        if (!listText.trim()) {
            document.getElementById('output').innerText = "请在上方输入框输入数字或拍照。";
            return;
        }

        // 1. 建立映射字典
        const mapping = {};
        mapText.split(/\n/).forEach(line => {
            line = line.trim();
            if (!line) return;
            const match = line.match(/^(\d+)[\.\s]*(.*)/);
            if (match) mapping[match[1]] = match[2];
        });

        // 2. 提取所有数字
        const numbers = listText.match(/\d+/g);
        
        if (!numbers) {
            document.getElementById('output').innerText = "未检测到有效数字。";
            return;
        }

        // 3. 生成结果
        const results = numbers.map(num => {
            const name = mapping[num];
            return name ? `${num}${name}` : `${num}(?)`;
        });

        document.getElementById('output').innerText = results.join("。") + "。";
    }

    function copyResult() {
        const text = document.getElementById('output').innerText;
        navigator.clipboard.writeText(text).then(() => {
            alert("结果已复制！");
        });
    }
</script>
